<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" role="img" aria-label="A request passes down through the MCP layer, the business logic layer and the database layer, and the answer comes back up the same way">
  <style>
    .seal{font:700 9px Inter,'Helvetica Neue',Arial,sans-serif;letter-spacing:.08em;fill:#FFFFFF}
    .sealsub{font:400 8.5px Inter,'Helvetica Neue',Arial,sans-serif;letter-spacing:.03em;fill:#FFFFFF;opacity:.72}
    .ph{font:700 10.5px Inter,'Helvetica Neue',Arial,sans-serif;letter-spacing:.06em;fill:#292929}
    .ps{font:400 8.5px Inter,'Helvetica Neue',Arial,sans-serif;letter-spacing:.04em;fill:#0A7D18}
    .pb{font:400 8.5px Inter,'Helvetica Neue',Arial,sans-serif;fill:#33363B}
    .arr{font:700 7.5px Inter,'Helvetica Neue',Arial,sans-serif;letter-spacing:.08em;fill:#8A8A8D}
    .hook{font:700 7.5px Inter,'Helvetica Neue',Arial,sans-serif;letter-spacing:.08em;fill:#0A7D18}
    .st{font:700 9.5px Inter,'Helvetica Neue',Arial,sans-serif;letter-spacing:.06em;fill:#FFFFFF}
    .ss{font:400 8.5px Inter,'Helvetica Neue',Arial,sans-serif;fill:rgba(255,255,255,0.72)}
  </style>
  <rect x="0.5" y="0.5" width="519" height="249" fill="#FFFFFF" stroke="#292929" stroke-width="1"/>
  <rect x="0.5" y="0.5" width="519" height="28" fill="#292929"/>
  <text class="seal" x="14" y="18">HOW A QUESTION IS ANSWERED</text>
  <text class="sealsub" x="506" y="18" text-anchor="end">down three layers, back up the same three</text>

  <text class="arr" x="14" y="46">ASSISTANT</text>
  <text class="pb" x="66" y="46">a JSON-RPC message over stdio or Streamable HTTP</text>

  <rect x="60.5" y="56.5" width="399" height="46" fill="#FFFFFF" stroke="#292929" stroke-width="1"/>
  <rect x="60.5" y="56.5" width="4" height="46" fill="#0BB81E"/>
  <text class="ph" x="76" y="74">MCP LAYER</text>
  <text class="ps" x="76" y="85">tools, resources, prompts</text>
  <text class="pb" x="220" y="74">Parses the message, names the tool.</text>
  

  <rect x="60.5" y="112.5" width="399" height="58" fill="#FFFFFF" stroke="#292929" stroke-width="1"/>
  <rect x="60.5" y="112.5" width="4" height="58" fill="#0BB81E"/>
  <text class="ph" x="76" y="130">BUSINESS LOGIC</text>
  <text class="hook" x="76" y="152">HOOKS: BEFORE AND AFTER</text>
  <text class="ps" x="76" y="141">validate, then execute</text>
  <text class="pb" x="220" y="130">Validation engine checks the request against the vCon spec.</text>
  <text class="pb" x="220" y="142">Plugin hooks run before and after reads, searches, writes.</text>
  <text class="pb" x="220" y="154">Query engine writes the parent row first, then children.</text>

  <rect x="60.5" y="180.5" width="399" height="42" fill="#FFFFFF" stroke="#292929" stroke-width="1"/>
  <rect x="60.5" y="180.5" width="4" height="42" fill="#0BB81E"/>
  <text class="ph" x="76" y="198">DATABASE</text>
  <text class="ps" x="76" y="209">Redis first, then Postgres</text>
  <text class="pb" x="220" y="198">Eight tables, joined back into one vCon on the way out.</text>
  <text class="pb" x="220" y="210">A cache hit skips Postgres. A miss is cached.</text>

  <line x1="34" y1="56" x2="34" y2="216" stroke="#292929" stroke-width="1"/>
  <path d="M31 216 L34 222 L37 216 Z" fill="#292929"/>
  <text class="arr" x="20" y="140" transform="rotate(-90 20 140)" text-anchor="middle">REQUEST</text>

  <line x1="486" y1="222" x2="486" y2="62" stroke="#292929" stroke-width="1"/>
  <path d="M483 62 L486 56 L489 62 Z" fill="#292929"/>
  <text class="arr" x="500" y="140" transform="rotate(90 500 140)" text-anchor="middle">ANSWER</text>

  <text class="pb" x="14" y="235">A request that fails validation never reaches the database.</text>
  <text class="pb" x="14" y="245">Plugins hook reads, searches and writes in the business logic layer.</text>
</svg>
