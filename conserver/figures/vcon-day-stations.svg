<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 402" width="520" height="402" role="img" aria-label="The stations one vCon passes through, from the phone system to an AI assistant">
  <style>
    .num{font:700 10px Inter,'Helvetica Neue',Arial,sans-serif;fill:#0A7D18}
    .lab{font:700 9.5px Inter,'Helvetica Neue',Arial,sans-serif;letter-spacing:.06em;fill:#292929}
    .val{font:400 10.5px Inter,'Helvetica Neue',Arial,sans-serif;fill:#33363B}
    .adds{font:400 9.5px Inter,'Helvetica Neue',Arial,sans-serif;fill:#0A7D18}
    .seal{font:700 9px Inter,'Helvetica Neue',Arial,sans-serif;letter-spacing:.08em;fill:#FFFFFF}
    .sealsub{font:400 8.5px Inter,'Helvetica Neue',Arial,sans-serif;letter-spacing:.03em;fill:#FFFFFF;opacity:.72}
    .band{font:700 8.5px Inter,'Helvetica Neue',Arial,sans-serif;letter-spacing:.1em;fill:#8A8A8D}
  </style>
  <rect x="0.5" y="0.5" width="519" height="401" fill="#FFFFFF" stroke="#292929" stroke-width="1"/>
  <rect x="0.5" y="0.5" width="519" height="28" fill="#292929"/>
  <text class="seal" x="14" y="18">ONE VCON &#183; TWELVE STOPS</text>
  <text class="sealsub" x="506" y="18" text-anchor="end">the right column is what the vCon carries after the stop</text>

  <!-- column heads -->
  <text class="band" x="14" y="44">STOP</text>
  <text class="band" x="150" y="44">WHAT HAPPENS</text>
  <text class="band" x="372" y="44">ADDED TO THE RECORD</text>
  <line x1="0.5" y1="50.5" x2="519.5" y2="50.5" stroke="#292929" stroke-opacity="0.25"/>

  <!-- belt -->
  <line x1="24" y1="58" x2="24" y2="382" stroke="#0BB81E" stroke-width="2" stroke-opacity="0.35"/>

  <g id="rows">
    <!-- 0 -->
    <circle cx="24" cy="66" r="4" fill="#0BB81E"/>
    <text class="lab" x="38" y="70">0 CONVERSATION</text>
    <text class="val" x="150" y="70">Phone system records the call</text>
    <text class="adds" x="372" y="70">nothing yet</text>
    <line x1="0.5" y1="78.5" x2="519.5" y2="78.5" stroke="#292929" stroke-opacity="0.12"/>
    <!-- 1 -->
    <circle cx="24" cy="94" r="4" fill="#0BB81E"/>
    <text class="lab" x="38" y="98">1 ADAPTER</text>
    <text class="val" x="150" y="98">SIPREC adapter builds the vCon</text>
    <text class="adds" x="372" y="98">parties, dialog, lawful basis</text>
    <line x1="0.5" y1="106.5" x2="519.5" y2="106.5" stroke="#292929" stroke-opacity="0.12"/>
    <!-- 2 -->
    <circle cx="24" cy="122" r="4" fill="#0BB81E"/>
    <text class="lab" x="38" y="126">2 INGRESS</text>
    <text class="val" x="150" y="126">POST /vcon, stored at vcon:{uuid}</text>
    <text class="adds" x="372" y="126">a place on the list</text>
    <line x1="0.5" y1="134.5" x2="519.5" y2="134.5" stroke="#292929" stroke-opacity="0.12"/>
    <!-- 3 -->
    <circle cx="24" cy="150" r="4" fill="#0A7D18"/>
    <text class="lab" x="38" y="154">3 CHAIN</text>
    <text class="val" x="150" y="154">A task per UUID, tracers start watching</text>
    <text class="adds" x="372" y="154">nothing, tracers never write</text>
    <line x1="0.5" y1="162.5" x2="519.5" y2="162.5" stroke="#292929" stroke-opacity="0.12"/>
    <!-- 4 -->
    <circle cx="24" cy="178" r="4" fill="#0A7D18"/>
    <text class="lab" x="38" y="182">4 RECEIPT</text>
    <text class="val" x="150" y="182">scitt link, vcon_created</text>
    <text class="adds" x="372" y="182">analysis: scitt_receipt</text>
    <line x1="0.5" y1="190.5" x2="519.5" y2="190.5" stroke="#292929" stroke-opacity="0.12"/>
    <!-- 5 -->
    <circle cx="24" cy="206" r="4" fill="#0A7D18"/>
    <text class="lab" x="38" y="210">5 TRANSCRIBE</text>
    <text class="val" x="150" y="210">deepgram_link, audio becomes text</text>
    <text class="adds" x="372" y="210">analysis: transcript</text>
    <line x1="0.5" y1="218.5" x2="519.5" y2="218.5" stroke="#292929" stroke-opacity="0.12"/>
    <!-- 6 -->
    <circle cx="24" cy="234" r="4" fill="#0A7D18"/>
    <text class="lab" x="38" y="238">6 ANALYZE, TAG</text>
    <text class="val" x="150" y="238">analyze, then check_and_tag for recalls</text>
    <text class="adds" x="372" y="238">analysis: summary, tag: recall</text>
    <line x1="0.5" y1="246.5" x2="519.5" y2="246.5" stroke="#292929" stroke-opacity="0.12"/>
    <!-- 7 -->
    <circle cx="24" cy="262" r="4" fill="#0A7D18"/>
    <text class="lab" x="38" y="266">7 ROUTE</text>
    <text class="val" x="150" y="266">tag_router pushes UUID to recall_review</text>
    <text class="adds" x="372" y="266">nothing, a second chain starts</text>
    <line x1="0.5" y1="274.5" x2="519.5" y2="274.5" stroke="#292929" stroke-opacity="0.12"/>
    <!-- 8 -->
    <circle cx="24" cy="290" r="4" fill="#0A7D18"/>
    <text class="lab" x="38" y="294">8 CUSTOM LINK</text>
    <text class="val" x="150" y="294">crm_lookup asks the system of record</text>
    <text class="adds" x="372" y="294">attachment: CRM record</text>
    <line x1="0.5" y1="302.5" x2="519.5" y2="302.5" stroke="#292929" stroke-opacity="0.12"/>
    <!-- 9 -->
    <circle cx="24" cy="318" r="4" fill="#0A7D18"/>
    <text class="lab" x="38" y="322">9 RECEIPT, EXPIRE</text>
    <text class="val" x="150" y="322">scitt vcon_enhanced, 24h TTL on Redis</text>
    <text class="adds" x="372" y="322">analysis: second scitt_receipt</text>
    <line x1="0.5" y1="330.5" x2="519.5" y2="330.5" stroke="#292929" stroke-opacity="0.12"/>
    <!-- 10 -->
    <circle cx="24" cy="346" r="4" fill="#292929"/>
    <text class="lab" x="38" y="350">10 STORAGE</text>
    <text class="val" x="150" y="350">Postgres, S3, vCon MCP in parallel</text>
    <text class="adds" x="372" y="350">the same JSON, three places</text>
    <line x1="0.5" y1="358.5" x2="519.5" y2="358.5" stroke="#292929" stroke-opacity="0.12"/>
    <!-- 11 -->
    <circle cx="24" cy="374" r="4" fill="#292929"/>
    <text class="lab" x="38" y="378">11 MCP, ASSISTANT</text>
    <text class="val" x="150" y="378">vcon_search, vcon_fetch, a cited answer</text>
    <text class="adds" x="372" y="378">nothing, this is the read path</text>
  </g>
  <line x1="0.5" y1="388.5" x2="519.5" y2="388.5" stroke="#292929" stroke-opacity="0.25"/>
</svg>
